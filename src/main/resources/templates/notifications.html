<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Notifications</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bodyContainer">
<!-- Chart Start -->
<div class="container-fluid pt-4">
    <div class="row g-4 ">
        <div class="col-sm-12  col-xl-12">

            <div class="h-100 bg-light rounded p-4">
                <div class="mb-3">
                    <a th:href="@{/todos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h6 class="mb-0">Notifications</h6>
                </div>

                <div class="d-flex align-items-center border-bottom py-3" th:each="task,hey :${tasks}">
                    <a class="d-flex" th:if="${task.completed}">
                        <a class="w-100 ms-3 ml-5" th:href="@{/todo/{id}(id=${task.id})}">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-0 " th:classappend="${task.completed} ? 'completed': 'notcompleted' " th:text="${task.title}"></h6>
                                <small th:text="${task.created}"></small>

                            </div>
                            <div class="d-flex w-100 justify-content-between">
                                <span th:classappend="${task.completed} ? 'completed': 'notcompleted' " th:text="${task.description != null ? #strings.abbreviate(task.description, 50) : ''}"></span>
                                <small  th:classappend="${task.priority}== 'HIGH' ? 'text-danger' : 'text-success' " th:text="${task.priority}"></small>
                            </div>
                        </a>
                    </a>
                </div>

            </div>
        </div>
        <nav class="bottom-nav">
            <a th:href="@{/todos}" class="nav-item">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/calendar}" class="nav-item">
                <i class="bi bi-calendar"></i>
                <span>Calendar</span>
            </a>

            <a th:href="@{/notifications}" class="nav-item"  th:classappend="${currentPage == 'notificationstab'} ? 'active' : ''">
                <i class="bi bi-bell"> <span class="bg-danger text-white" th:text="${noOfNotifications} == '0'?'' : ${noOfNotifications}"></span></i>
                <span>Notifications</span>
            </a>

            <a th:href="@{/profile}" class="nav-item">
                <i class="=bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>

    </div>
</div>
<!-- Chart End -->
</body>
<!-- Template Javascript -->

<script>
    function toggleMenu(button) {
        const menu = button.nextElementSibling;
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
</script>
</html>
