<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>View Task</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bodyContainer">
<!-- Chart Start -->
<div class="container-fluid pt-4">
    <div class="row g-4 ">
        <div class="col-sm-12  col-xl-12">
            <div class="bg-light rounded h-100 p-4" >
                <div class="mb-3">
                    <a th:href="@{/notification}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <h6 class="mb-4">View Notification</h6>

                    <form autocomplete="off" th:action="@{/todo/{id}(id=${tasks.id})}" th:method="post">
                        <div class="mb-3">
                            <label for="notificationTitle" class="form-label fw-bold">Title</label>
                            <input th:value="${noti.title}" required name="title"  class="form-control" id="notificationTitle"
                                   aria-describedby="notificationTitleHelp"/>

                        </div>
                        <div class="mb-3">
                            <label for="notificationDescription" class="form-label fw-bold">Description</label>
                            <textarea class="form-control"  name="description"  th:text="${noti.description}"
                                      id="notificationDescription" style="height: 150px;"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="notificationCreatedAt" class="form-label fw-bold">Created At</label>
                            <input class="form-control" name="dueDate" type="date" th:value="${noti.created}"
                                    id="notificationCreatedAt"/>
                        </div>

                    </form>
            </div>
        </div>

        <nav class="bottom-nav">
            <a th:href="@{/todos}" class="nav-item">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/calendar}" class="nav-item">
                <i class="bi bi-calendar"></i>
                <span>Calendar</span>
            </a>

            <a th:href="@{/notifications}" class="nav-item">
                <i class="bi bi-bell"> <span class="bg-danger text-white" th:text="${noOfNotifications} == '0'?'' : ${noOfNotifications}"></span></i>
                <span>Notifications</span>
            </a>
            <a th:href="@{/profile}" class="nav-item">
                <i class="=bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
</div>
<script src="/js/main.js"></script>

</body>
</html>
