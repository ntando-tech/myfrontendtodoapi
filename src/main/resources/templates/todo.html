<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Add New Task</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <!--    <link href="img/favicon.ico" rel="icon">-->

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="content">
<!-- Form Start -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-sm-12 col-xl-6">
            <div class="bg-light rounded h-100 p-4">
                <div class="mb-3">
                    <a th:href="@{/trytodos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <h6 class="mb-4">Basic Form</h6>
                <form th:action="@{/todo/save/task}" method="post" autocomplete="off">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">Title</label>
                        <input type="text" required class="form-control" name="title" id="taskTitle" placeholder="Enter Title"
                               aria-describedby="taskHelp">

                    </div>
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">Description</label>
                        <textarea class="form-control" name="description" placeholder="Enter task description"
                                  id="taskDescription" style="height: 150px;"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="selectPriority" class="form-label">Priority</label>
                        <select class="form-select" name="priority" id="selectPriority"
                                aria-label="Floating label select example">
                            <option selected value="">Open this select priority</option>
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="taskDueDate" class="form-label">Due Date</label>
                        <!--                        <input type="hidden" th:field="*{created}"/>-->
                        <input class="form-control" type="date" name="dueDate" th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"  id="taskDueDate">
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary ">Add Task</button>
                        <button type="reset"  class="btn btn-warning text-end">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
