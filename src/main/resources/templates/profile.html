<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Profile</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="content">
<!-- Chart Start -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-sm-12 col-md-6 col-xl-6">

            <div class="h-100 bg-light rounded p-4">

                <div class="mb-3">
                    <a th:href="@{/todos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <h5 class="d-flex justify-content-center mb-3 ">Profile</h5>
                <div class="d-flex justify-content-center mb-2">

                    <a href="#" style="text-align: center;" >
                        <img class="rounded-circle me-lg-2" src="img/profile-default.svg" alt="profile image" style="width: 80px; height: 80px;text-align: center;">
                    </a>
                </div>

                <form class="mt-3" autocomplete="off">
                    <div th:each="userInfo:${profileInfo}">
                    <div class="mb-3">
                        <label for="profileUsername" class="form-label">Username</label>
                        <input type="text" class="form-control " th:value="${userInfo.username}" disabled id="profileUsername"
                               aria-describedby="profileUsernameInfo">
                        <div id="profileUsernameInfo" class="form-text">We'll never share your username with anyone else.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="profileEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" th:value="${userInfo.email}" disabled id="profileEmail"
                               aria-describedby="profileEmail">
                        <div id="profileEmailInfo" class="form-text">We'll never share your email with anyone else.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="profileAccountStatus" class="form-label">Account status</label>
                        <input type="text" class="form-control" th:value="${userInfo.enable} ? 'Active' : 'Not Active'" disabled id="profileAccountStatus"
                               aria-describedby="profileAccountInfo">
                        <div id="profileAccountStatusInfo" class="form-text">We'll never share your status with anyone else.
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Check me out</label>
                    </div>
                    </div>
                </form>

            </div>
        </div>


    </div>
</div>

<!-- Template Javascript -->

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="lib/chart/chart.min.js"></script>
<script src="lib/easing/easing.min.js"></script>
<script src="lib/waypoints/waypoints.min.js"></script>
<script src="lib/owlcarousel/owl.carousel.min.js"></script>
<script src="lib/tempusdominus/js/moment.min.js"></script>
<script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

<!-- Template Javascript -->
<script src="js/main.js"></script>
</body>


</html>
