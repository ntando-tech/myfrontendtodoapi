<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Signup</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<!-- Sign Up Start -->
<div class="container-fluid bg-white">
    <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <p class="">
                        <h3 class="text-primary">Task Tracker</h3>
                    </p>
                    <h3>Sign Up</h3>
                </div>
                <form autocomplete="off">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="signupUsername" placeholder="Username">
                    <label for="signupUsername">Username</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="signupEmailAddress" placeholder="Email Address">
                    <label for="signupEmailAddress">Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="signupPassword" placeholder="Password">
                    <label for="signupPassword">Password</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control"  id="signupConfirmPassword" placeholder="Password">
                    <label for="signupConfirmPassword">Confirm Password</label>
                </div>
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <a href="">Forgot Password</a>
                </div>
                <button type="submit" class="btn btn-primary py-3 w-100 mb-4" >Sign Up</button>
                <p class="text-center mb-0">Already have an Account? <a th:href="@{/signin}">Sign In</a></p>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Sign Up End -->
</body>
</html>
