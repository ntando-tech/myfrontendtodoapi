<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Signin</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid bg-white">
    <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <p class="">
                        <h3 class="text-primary">Task Tracker</h3>
                    </p>
                    <h3>Sign In</h3>
                </div>
                <form autocomplete="off" th:action="@{/signin}" th:method="post" class="was-validated" onsubmit="showLoader()">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control"  required autofocus th:name="username" id="signinUsername" placeholder="username">
                    <label for="signinUsername">Username</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" required class="form-control" th:name="password" th:maxlength="25" id="signinPassword" placeholder="Password">
                    <label for="signinPassword">Password</label>
                    <p type="button" onclick="showSigninPassword()"
                       class="btn position-absolute top-50 end-0 translate-middle-y me-4 border-0 bg-transparent"
                    >
                        <i id="signinPasswordEyeIcon" class="bi bi-eye-fill"></i>
                    </p>
                </div>

                    <p class="text-danger" th:text="${signinError}"></p>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input type="checkbox" th:name="rememberMe" class="form-check-input" id="signinCheckmeout">
                        <label  for="signinCheckmeout" >Remember me</label>  <!--class="form-check-label"-->
                    </div>
                    <a th:href="@{/forgotPassword}">Forgot Password</a>
                </div>
                <button type="submit" id="signinBtn" class="btn btn-primary py-3 w-100 mb-4">Sign In</button>
                <p class="text-center mb-0">Don't have an Account? <a th:href="@{/signup}">Sign Up</a></p>
                </form>

                <div id="loaderOverlay">
                    <div class="spinner"></div>
                    <p>Signing in...</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/main.js"></script>

</body>
</html>
