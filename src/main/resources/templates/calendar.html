<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Calendar</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bodyContainer">
<!-- Chart Start -->
<div class="container-fluid pt-4">
    <div class="row g-4 ">
        <div class="col-sm-12  col-xl-12">
<!--            <div class="h-100 bg-light rounded p-4">-->
<!--                -->
<!--            </div>-->

                <div class="mb-3 mt-2">
                    <a th:href="@{/todos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <div class="d-flex align-items-center justify-content-between\">
                    <h6 class="mb-1">Calendar</h6>
                </div>

                <div class="calendar-header">

                    <h1 id="monthYear"></h1>

                    <div ><br>
                        <div class="calendarNavigation">

                            <button onclick="previousMonth()">
                                Previous
                            </button>

                            <button onclick="goToToday()">
                                Today
                            </button>

                            <button onclick="nextMonth()">
                                Next
                            </button>

                        </div>

                    </div>
                </div>

                <div class="weekdays">

                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>

                </div>


                <div id="calendarDays"
                     class="days mb-5">

                </div>




            <!-- Task Details Modal -->

            <div id="taskModal"
                 class="calendarModal">

                <div class="calendarModal-content">

        <span class="close"
              onclick="closeCalendarModal()">
            &times;
        </span>

                    <h2 id="modalTitle"></h2>

                    <p>
                        <strong>Description:</strong>
                    </p>

                    <p id="modalDescription"></p>

                    <p>
                        <strong>Priority:</strong>
                    </p>

                    <p id="modalPriority"></p>
                    <p>
                        <strong>Due Date:</strong>
                    </p>

                    <p id="modalDate"></p>


                </div>

            </div>
        </div>
        <nav class="bottom-nav">
            <a th:href="@{/todos}" class="nav-item">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/calendar}" class="nav-item "  th:classappend="${currentPage == 'calendartab'} ? 'active' : ''">
                <i class="fa fa-calendar mt-2"></i>
                <span>Calendar</span>
            </a>

            <a th:href="@{/notifications}" class="nav-item">
                <i class="bi bi-bell"> <span class="bg-danger text-white" th:text="${noOfNotifications} == '0'?'' : ${noOfNotifications}"></span></i>
                <span>Notifications</span>
            </a>

            <a th:href="@{/profile}" class="nav-item">
                <i class="=bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
</div>

<script src="/js/main.js"></script>
</body>
<script th:inline="javascript">

    const tasks = /*[[${tasks}]]*/ [];
</script>

<script>
    function toggleMenu(button) {
        const menu = button.nextElementSibling;
        menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
</script>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/lib/chart/chart.min.js"></script>
<script src="/lib/easing/easing.min.js"></script>
<script src="/lib/waypoints/waypoints.min.js"></script>
<script src="/lib/owlcarousel/owl.carousel.min.js"></script>
<script src="/lib/tempusdominus/js/moment.min.js"></script>
<script src="/lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>
<script src="js/calendar.js"></script>
</html>
