<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>View Task</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Customized Bootstrap Stylesheet -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bodyContainer">
<!-- Chart Start -->
<div class="container-fluid pt-4">
    <div class="row g-4 ">
        <div class="col-sm-12  col-xl-12">
            <div class="bg-light rounded h-100 p-4" >
                <div class="mb-3">
                    <a th:href="@{/todos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <h6 class="mb-4">Edit Task</h6>

               <div th:if="${tasks.completed} == false">

                <form autocomplete="off" th:action="@{/todo/{id}(id=${tasks.id})}" th:method="post">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label fw-bold">Title</label>
                        <input th:value="${tasks.title}" required name="title"  class="form-control" id="taskTitle"
                               aria-describedby="taskTitleHelp"/>

                    </div>
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label fw-bold">Description</label>
                        <textarea class="form-control"  name="description"  th:text="${tasks.description}"
                                  id="taskDescription" style="height: 150px;"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label fw-bold">Priority</label>
                        <select class="form-select" name="priority" id="selectPriority"
                                aria-label="Floating label select example">
                            <option th:value="LOW" th:selected="${tasks.priority == 'LOW'}">LOW</option>
                            <option th:value="MEDIUM" th:selected="${tasks.priority == 'MEDIUM'}">MEDIUM</option>
                            <option th:value="HIGH" th:selected="${tasks.priority == 'HIGH'}">HIGH</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="taskDueDate" class="form-label fw-bold">Due Date</label>
                        <input class="form-control" name="dueDate" type="date" th:value="${tasks.dueDate}"
                               th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"  id="taskDueDate"/>
                    </div>
                    <div class="mb-3">

                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" hidden id="deleteTask" name="_method" value="delete" class="btn btn-danger ml-4">Delete</button>
                        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                            Delete
                        </button>

                        <div class="modal" id="deleteModal">
                            <div class="modal-dialog">
                                <div class="modal-content">

                                    <div class="modal-header">
                                        <h4 class="modal-title">Delete Task</h4>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>

                                    <div class="modal-body">
                                        Are you sure you want to delete this task?
                                    </div>
                                    <div class="modal-footer d-flex justify-content-between">
                                        <button type="button"  onclick="delete_task_button_no()" class="btn btn-danger" data-bs-dismiss="modal">No</button>
                                        <button type="button" onclick="delete_task_button_yes()" class="btn btn-primary" data-bs-dismiss="modal">Yes</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button hidden type="submit" id="saveTask" name="_method" value="put" class="btn btn-primary">Save</button>
                        <button type="button" id="saveTask2" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#saveModal">
                            Save
                        </button>
                    </div>
                </form>

                   <div class="modal" id="saveModal">
                       <div class="modal-dialog">
                           <div class="modal-content">

                               <div class="modal-header">
                                   <h4 class="modal-title">Save Task</h4>
                                   <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                               </div>

                               <div class="modal-body">
                                Are you sure you want to save this task?
                               </div>
                               <div class="modal-footer d-flex justify-content-between">
                                   <button type="button"  onclick="save_task_button_no()" class="btn btn-danger" data-bs-dismiss="modal">No</button>
                                   <button type="button" onclick="save_task_button_yes()" class="btn btn-primary" data-bs-dismiss="modal">Yes</button>
                               </div>
                           </div>
                       </div>
                       </div>

                   <div class="d-flex justify-content-center pt-0">
                       <form th:action="@{/todo/{id}(id=${tasks.id})}" method="post">
                           <input type="hidden" name="_method" value="patch"/>
                           <div class="mb-3">
                               <label for="taskCompletion" class="fw-bold pt-0">Completed:</label>
                               <input type="checkbox"
                                      id="taskCompletion"
                                      th:checked="${tasks.completed}"
                                      onclick="this.form.submit()"
                               />
                           </div>
                       </form>
                   </div>
                </div>

                <div th:if="${tasks.completed}">

                    <form autocomplete="off" th:action="@{/todo/{id}(id=${tasks.id})}" th:method="post">
                        <div class="mb-3">
                            <label for="taskTitle2" class="form-label fw-bold">Title</label>
                            <input th:value="${tasks.title}" disabled required name="title"  class="form-control" id="taskTitle2"
                                   aria-describedby="taskTitleHelp"/>

                        </div>
                        <div class="mb-3">
                            <label for="taskDescription2" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" disabled  name="description"  th:text="${tasks.description}"
                                  id="taskDescription2" style="height: 150px;"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="selectPriority2" class="form-label fw-bold">Priority</label>
                            <select class="form-select" disabled name="priority" id="selectPriority2"
                                    aria-label="Floating label select example">
                                <option th:value="LOW" th:selected="${tasks.priority == 'LOW'}">LOW</option>
                                <option th:value="MEDIUM" th:selected="${tasks.priority == 'MEDIUM'}">MEDIUM</option>
                                <option th:value="HIGH" th:selected="${tasks.priority == 'HIGH'}">HIGH</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="taskDueDate2" class="form-label fw-bold">Due Date</label>
                            <input class="form-control" disabled name="dueDate" type="date" th:value="${tasks.dueDate}"
                                   th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"  id="taskDueDate2"/>
                        </div>
                        <div class="mb-3">


                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" hidden id="deleteTask2" name="_method" value="delete" class="btn btn-danger ml-4">Delete</button>
                            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal2">
                                Delete
                            </button>

                            <div class="modal" id="deleteModal2">
                                <div class="modal-dialog">
                                    <div class="modal-content">

                                        <div class="modal-header">
                                            <h4 class="modal-title">Delete Task</h4>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>

                                        <div class="modal-body">
                                            Are you sure you want to delete this task?
                                        </div>
                                        <div class="modal-footer d-flex justify-content-between">
                                            <button type="button"  onclick="delete_task_button_no()" class="btn btn-danger" data-bs-dismiss="modal">No</button>
                                            <button type="button" onclick="delete_task_button_yess()" class="btn btn-primary" data-bs-dismiss="modal">Yes</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" disabled name="_method" value="put" class="btn btn-primary">Save</button>

                        </div>
                    </form>

                    <div class="d-flex justify-content-center pt-0 mb-5">
                        <form th:action="@{/todo/{id}(id=${tasks.id})}" method="post">
                            <input type="hidden" name="_method" value="patch"/>
                            <div class="mb-3">
                                <label for="taskCompletion2" class="fw-bold pt-0">Completed:</label>
                                <input type="checkbox"
                                       id="taskCompletion2"
                                       th:checked="${tasks.completed}"
                                       onclick="this.form.submit()"
                                />
                            </div>
                        </form>
                    </div>
                </div>


            </div>
        </div>

        <nav class="bottom-nav">
            <a th:href="@{/todos}" class="nav-item">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/calendar}" class="nav-item">
                <i class="bi bi-calendar"></i>
                <span>Calendar</span>
            </a>

            <a th:href="@{/notifications}" class="nav-item">
                <i class="bi bi-bell"> <span class="bg-danger text-white" th:text="${noOfNotifications} == '0'?'' : ${noOfNotifications}"></span></i>
                <span>Notifications</span>
            </a>
            <a th:href="@{/profile}" class="nav-item">
                <i class="=bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
</div>
<script src="/js/main.js"></script>

<script th:inline="javascript">
    const tasks = /*[[${tasks}]]*/ [];
</script>
<script src="/js/editTask.js"></script>
</body>
</html>
