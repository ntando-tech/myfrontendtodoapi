<!DOCTYPE html>
<html lang="en">
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Delete Account</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bodyContainer">
<!-- Chart Start -->
<div class="container-fluid pt-4">
    <div class="row g-4 ">
        <div class="col-sm-12  col-xl-12">
            <div class="h-100 bg-light rounded p-4">

                <div class="mb-3">
                    <a th:href="@{/todos}" class="bi bi-arrow-left-circle-fill">Back</a>
                </div>
                <h6 >Delete Account</h6>


                <form class="mt-5 was-validated" th:action="@{/deleteAccount}" th:method="post" autocomplete="off" onsubmit="showLoader()">
                    <div class="form-floating mb-5">
                        <div id="accountDeleteConfirmationInfo" class="form-text mb-2">If you want to delete your Task Tracker account type
                            <b>Permanently Delete My Account</b>
                        </div>
<!--                        <input type="text" class="form-control mt-2" id="accountDeleteConfirmation"-->
<!--                               aria-describedby="deleteAccountInput">-->
                        <input type="text" class="form-control"  required autofocus id="accountDeleteConfirmation">
<!--                        <label for="accountDeleteConfirmation">Enter Deletion Statement</label>-->
                        <p class="mt-3" id="accountDeletionErrorMessage" th:text="accountDeletionErrorMessage"></p>
                    </div>

                    <div class="d-flex justify-content-between mt-5">
                        <button type="submit" th:name="_method"  hidden th:value="delete" class="btn btn-danger mt-5" id="deleteAccount">Delete</button>
                        <button type="button" class="btn btn-danger mt-5" id="deleteAccountButton" data-bs-toggle="modal" data-bs-target="#deleteModal">
                            <i class="fa fa-trash me-1"></i>  Delete
                        </button>
                        <button type="button" onclick="deleteResetBtn()" id="deleteAccountResetBtn" class="btn btn-primary mt-5"><i class="bi bi-x-circle-fill me-1"></i>Clear</button>

                        <div class="modal" id="deleteModal">
                            <div class="modal-dialog">
                                <div class="modal-content">

                                    <div class="modal-header">
                                        <h4 class="modal-title">Delete Account</h4>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>

                                    <div class="modal-body">
                                        Are you sure you want to permanently delete your account?
                                    </div>
                                    <div class="modal-footer d-flex justify-content-between">
                                        <button type="button"  onclick="delete_account_button_no()" class="btn btn-primary" data-bs-dismiss="modal">No</button>
                                        <button type="button" onclick="delete_account_button_yes()" class="btn btn-danger" data-bs-dismiss="modal">Yes</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
                <div id="loaderOverlay">
                    <div class="spinner">
                        <p>Deleting Account...</p>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a th:href="@{/todos}" class="nav-item">
                <i class="bi bi-house"></i>
                <span>Home</span>
            </a>

            <a th:href="@{/calendar}" class="nav-item">
                <i class="bi bi-calendar"></i>
                <span>Calendar</span>
            </a>

            <a th:href="@{/completedTasks}" class="nav-item">
                <i class="fa fa-tasks mb-2"></i>
                <span>Completed</span>
            </a>
            <a th:href="@{/profile}" class="nav-item">
                <i class="=bi bi-person"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
</div>

<!-- Template Javascript -->

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="lib/chart/chart.min.js"></script>
<script src="lib/easing/easing.min.js"></script>
<script src="lib/waypoints/waypoints.min.js"></script>
<script src="lib/owlcarousel/owl.carousel.min.js"></script>
<script src="lib/tempusdominus/js/moment.min.js"></script>
<script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
<script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

<!-- Template Javascript -->
<script src="/js/main.js"></script>
<script src="/js/deleteAccount.js"></script>
</body>


</html>
